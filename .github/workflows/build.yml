name: Multi-Platform Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: windows
            runner: windows-latest
            arch: amd64
            binary_name: misignage.exe
          - os: linux
            runner: ubuntu-latest
            arch: amd64
            binary_name: misignage-linux
          - os: darwin
            runner: macos-latest
            arch: arm64
            binary_name: misignage-macos

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build
        env:
          CI: false

      - name: Prepare Backend Assets
        shell: bash
        run: |
          mkdir -p backend/dist
          cp -r frontend/dist/* backend/dist/

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - name: Build Backend
        run: |
          cd backend
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -o ../${{ matrix.binary_name }} ./main.go

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: misignage-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ matrix.binary_name }}
