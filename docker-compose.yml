version: '3.8'

services:
  misignage:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    environment:
      - DB_TYPE=sqlite
      - DB_DSN=/app/data/misignage.db
      - BOOTSTRAP_USER_EMAIL=admin@example.com
      # - BOOTSTRAP_USER_PASSWORD=your_secure_password
    restart: unless-stopped
